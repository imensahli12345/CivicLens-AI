<div
  class="simple-alert"
  *ngIf="open"
  [class.simple-alert--success]="type === 'success'"
  [class.simple-alert--error]="type === 'error'"
>
  <span>
    {{ displayText }}
    <a
      *ngIf="linkUrl"
      class="simple-alert__link"
      [href]="linkUrl"
      (click)="$event.stopPropagation()"
    >
      Cliquez ici
    </a>
  </span>
  <button type="button" (click)="onClose()" aria-label="Fermer">x</button>
</div>
