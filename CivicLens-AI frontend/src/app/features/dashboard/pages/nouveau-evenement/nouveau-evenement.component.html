<div class="page-container fade-in">
  <div class="page-topbar">
    <a routerLink="/dashboard/evenements" class="btn-back">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Retour aux événements
    </a>
  </div>

  <div class="form-card fade-up">
    <div class="form-header">
      <div class="header-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="14" x2="8" y2="18"/><line x1="12" y1="14" x2="12" y2="18"/><line x1="16" y1="14" x2="16" y2="18"/></svg>
      </div>
      <div>
        <h1>Créer un nouvel événement</h1>
        <p>Organisez une initiative citoyenne et rassemblez des volontaires de votre quartier.</p>
      </div>
    </div>

    <div *ngIf="errorMsg" class="alert-error">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      {{ errorMsg }}
    </div>

    <form (ngSubmit)="onSubmit()" #eventForm="ngForm" class="event-form">
      <div class="form-group">
        <label for="titre">Titre de l'événement <span class="required">*</span></label>
        <input type="text" id="titre" name="titre" [(ngModel)]="formData.titre" required placeholder="Ex: Grand nettoyage du parc communal" class="form-control">
      </div>

      <div class="form-group">
        <label for="description">Description détaillée <span class="required">*</span></label>
        <textarea id="description" name="description" [(ngModel)]="formData.description" required rows="4" placeholder="Décrivez l'objectif, le déroulement et ce dont les volontaires auront besoin..." class="form-control"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group half">
          <label for="dateEvenement">Date et Heure <span class="required">*</span></label>
          <input type="datetime-local" id="dateEvenement" name="dateEvenement" [(ngModel)]="formData.dateEvenement" required class="form-control">
        </div>
        
        <div class="form-group half">
          <label for="volontaires">Nombre de volontaires visé <span class="required">*</span></label>
          <input type="number" id="volontaires" name="nombreVolontairesRequis" [(ngModel)]="formData.nombreVolontairesRequis" required min="1" class="form-control">
        </div>
      </div>

      <div class="form-group">
        <label for="lieu">Lieu de rendez-vous <span class="required">*</span></label>
        <input type="text" id="lieu" name="lieu" [(ngModel)]="formData.lieu" required placeholder="Ex: Entrée principale du Parc Central" class="form-control">
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-outline" routerLink="/dashboard/evenements">Annuler</button>
        <button type="submit" class="btn btn-primary" [disabled]="!eventForm.form.valid || isSubmitting">
          <span *ngIf="isSubmitting" class="spinner small"></span>
          <span *ngIf="!isSubmitting">Publier l'événement</span>
        </button>
      </div>
    </form>
  </div>
</div>
