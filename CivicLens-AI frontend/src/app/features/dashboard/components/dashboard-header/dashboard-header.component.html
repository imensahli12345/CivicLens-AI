<header class="dashboard-header">
  <div class="header-left">
    <button class="btn-icon mobile-toggle" (click)="toggleSidebar.emit()">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <div class="header-greeting">
      <h1>{{ getGreeting() }}, <span>{{ user?.prenom || 'Citoyen' }}</span> !</h1>
      <p class="header-date">{{ getDate() }}</p>
    </div>
  </div>

  <div class="header-right">
    <!-- Tunisia badge -->
    <div class="country-badge">
      <span class="flag">🇹🇳</span>
      <span>Tunisie</span>
    </div>

    <!-- Notification bell -->
    <button class="btn-icon notif-btn" title="Notifications" (click)="toggleNotifications()">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="notif-dot" *ngIf="unreadCount() > 0"></span>
    </button>

    <div *ngIf="notificationsOpen()" class="notif-dropdown" (click)="$event.stopPropagation()">
      <div class="notif-dropdown-head">
        <div class="notif-dropdown-title">Notifications</div>
        <a routerLink="/dashboard/notifications" (click)="notificationsOpen.set(false)" class="notif-all-link">
          Tout afficher
        </a>
      </div>

      <div *ngIf="loadingTop()" class="notif-loading">Chargement...</div>

      <div *ngIf="!loadingTop() && topNotifications().length === 0" class="notif-empty">
        Aucune notification
      </div>

      <button
        *ngFor="let n of topNotifications()"
        class="notif-item"
        (click)="onNotificationClick(n)"
      >
        <span class="notif-item-dot" *ngIf="!n.isRead"></span>
        <div class="notif-item-content">
          <div class="notif-item-message">{{ n.message }}</div>
          <div class="notif-item-time">{{ formatShortDate(n.createdAt) }}</div>
        </div>
      </button>
    </div>

    <!-- User avatar -->
    <a routerLink="/dashboard/profil" class="header-avatar" title="Mon profil">
      <img *ngIf="user?.photoUrl" [src]="user!.photoUrl!" alt="Avatar" />
      <span *ngIf="!user?.photoUrl">{{ getAvatarLetters() }}</span>
    </a>
  </div>
</header>
