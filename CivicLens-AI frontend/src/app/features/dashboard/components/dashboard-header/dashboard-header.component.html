<header class="dashboard-header">
  <div class="header-top">
    <a routerLink="/dashboard" class="brand">
      <span class="brand-mark">CL</span>
      <span class="brand-text">
        <strong>CivicLens</strong> <em>AI</em>
      </span>
    </a>

    <div class="header-greeting-inline">
      <span class="greet">{{ getGreeting() }}, <strong>{{ user?.prenom || 'Citoyen' }}</strong></span>
      <span class="sep">•</span>
      <span class="date">{{ getDate() }}</span>
    </div>

    <div class="header-right">
    <!-- Tunisia badge -->
    <div class="country-badge">
      <span class="flag">🇹🇳</span>
      <span>Tunisie</span>
    </div>

    <!-- Notification bell -->
    <button class="btn-icon notif-btn" title="Notifications" (click)="$event.stopPropagation(); toggleNotifications()">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="notif-dot" *ngIf="unreadCount() > 0"></span>
    </button>

    <div *ngIf="notificationsOpen()" class="notif-dropdown" (click)="$event.stopPropagation()">
      <div class="notif-dropdown-head">
        <div class="notif-dropdown-title">Notifications</div>
        <a routerLink="/dashboard/notifications" (click)="notificationsOpen.set(false)" class="notif-all-link">
          Tout afficher
        </a>
      </div>

      <div *ngIf="loadingTop()" class="notif-loading">Chargement...</div>

      <div *ngIf="!loadingTop() && topNotifications().length === 0" class="notif-empty">
        Aucune notification
      </div>

      <button
        *ngFor="let n of topNotifications()"
        class="notif-item"
        (click)="onNotificationClick(n)"
      >
        <span class="notif-item-dot" *ngIf="!n.isRead"></span>
        <div class="notif-item-content">
          <div class="notif-item-message">{{ n.message }}</div>
          <div class="notif-item-time">{{ formatShortDate(n.createdAt) }}</div>
        </div>
      </button>
    </div>

    <!-- Profile menu -->
    <button class="header-avatar profile-trigger" type="button" title="Compte" (click)="toggleProfileMenu($event)">
      <img *ngIf="user?.photoUrl" [src]="user!.photoUrl!" alt="Avatar" />
      <span *ngIf="!user?.photoUrl">{{ getAvatarLetters() }}</span>
    </button>

    <div *ngIf="profileMenuOpen()" class="profile-dropdown" (click)="$event.stopPropagation()">
      <a routerLink="/dashboard/profil" class="profile-item" (click)="profileMenuOpen.set(false)">
        Profil
      </a>
      <a routerLink="/dashboard/settings" class="profile-item" (click)="profileMenuOpen.set(false)">
        Paramètres
      </a>
      <button type="button" class="profile-item danger" (click)="logout()">
        Déconnexion
      </button>
    </div>
    </div>
  </div>

  <div class="header-bottom">
    <nav class="header-nav" aria-label="Navigation du dashboard">
      <a
        *ngFor="let link of links"
        class="nav-link"
        [routerLink]="link.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: link.route === '/dashboard' }"
        (click)="notificationsOpen.set(false); profileMenuOpen.set(false)"
      >
        <span class="nav-icon" [innerHTML]="getIcon(link.icon)"></span>
        <span class="nav-label">{{ link.label }}</span>
      </a>
    </nav>
  </div>
</header>
