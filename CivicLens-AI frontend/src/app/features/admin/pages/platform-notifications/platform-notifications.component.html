<div class="page">
  <div class="page-head">
    <div>
      <div class="title">Notifications plateforme</div>
      <div class="subtitle">Demandes d’activation et réclamations reçues par l’admin.</div>
    </div>
    <button class="btn" (click)="load()" [disabled]="loading()">Rafraîchir</button>
  </div>

  <div *ngIf="error()" class="alert alert-error">{{ error() }}</div>
  <div *ngIf="loading()" class="loading">Chargement...</div>

  <div *ngIf="!loading() && !error()" class="table">
    <div class="row header">
      <div>Date</div>
      <div>Type</div>
      <div>Message</div>
      <div class="actions">Action</div>
    </div>
    <div class="row" *ngFor="let n of notifications()">
      <div class="muted">{{ formatDate(n.createdAt) }}</div>
      <div class="mono">{{ n.type }}</div>
      <div class="msg">{{ n.message }}</div>
      <div class="actions">
        <button class="btn primary" (click)="open(n)">Ouvrir</button>
      </div>
    </div>

    <div class="empty" *ngIf="notifications().length === 0">Aucune notification.</div>
  </div>
</div>
