<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CivicLens — Carte des Signalements</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Marker Cluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    header h1 { font-size: 18px; font-weight: 700; color: #38bdf8; letter-spacing: 0.5px; }
    header span { font-size: 13px; color: #64748b; }
    #ws-status {
      margin-left: auto;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      background: #1e3a4a;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #ws-dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; }
    #ws-dot.connected { background: #22c55e; box-shadow: 0 0 6px #22c55e; }

    /* ── Layout ── */
    .app-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 300px;
      background: #1e293b;
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;

    .filters {
      padding: 16px;
      border-bottom: 1px solid #334155;
    }

    .filter-group { margin-bottom: 10px; }
    .filter-group label { font-size: 11px; color: #64748b; display: block; margin-bottom: 4px; }
    .filter-group select {
      width: 100%;
      background: #0f172a;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;

    .btn-reset {

    .detail-images img { width: 80px; height: 60px; object-fit: cover; border-radius: 6px; border: 1px solid #334155; }

    #loading {

      top: 50%;

      transform: translate(-50%, -50%);

      padding: 16px 24px;
      border-radius: 10px;
      border: 1px solid #334155;
      font-size: 14px;

<script>
// ── Config ────────────────────────────────────────────────────────────────────
let API_BASE = '';
let WS_URL = '';
const FORCE_MOCK = false;

function getApiCandidates() {
  const candidates = [];
  const params = new URLSearchParams(window.location.search);
  const apiFromQuery = params.get('api');
  if (apiFromQuery) candidates.push(apiFromQuery.replace(/\/+$/, ''));

  // If frontend is served from backend origin, this usually works directly.
  if (window.location.origin && window.location.origin !== 'null') {
    candidates.push(window.location.origin);
  }

  const host = window.location.hostname || 'localhost';
  candidates.push(`http://${host}:8001`);
  candidates.push('http://127.0.0.1:8001');
  candidates.push('http://localhost:8001');

  // Unique values preserving order.
  return [...new Set(candidates)];
}

async function detectApiBase() {
  const candidates = getApiCandidates();
  for (const base of candidates) {
    try {
      const res = await fetch(`${base}/health`, { method: 'GET' });
      if (res.ok) return base;
    } catch (_) {
      // Try next candidate.
    }
  }
  // Default fallback for local dev.
  return 'http://localhost:8001';
}

function buildWsUrl(apiBase) {
  const url = new URL(apiBase);
  const wsProtocol = url.protocol === 'https:' ? 'wss:' : 'ws:';
  return `${wsProtocol}//${url.host}/ws/map-updates`;
}

// ── Map init (centered on Tunisia) ───────────────────────────────────────────
const TUNISIA_BOUNDS = L.latLngBounds(
  L.latLng(30.2, 7.5),
  L.latLng(37.55, 11.6)
);

const map = L.map('map', {
  center: [33.8869, 9.5375],
  zoom: 7,
  minZoom: 6,
  maxZoom: 18,
  maxBounds: TUNISIA_BOUNDS,
  maxBoundsViscosity: 1.0,
  zoomControl: true,
});

map.on('drag', () => map.panInsideBounds(TUNISIA_BOUNDS, { animate: false }));

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/">OpenStreetMap</a>',
  maxZoom: 18,
  bounds: TUNISIA_BOUNDS,
}).addTo(map);

map.fitBounds(TUNISIA_BOUNDS);
let governorateLayer = null;

// ── Tunisia Mask ──────────────────────────────────────────────────────────────
fetch('tunisia.json')
  .then(res => res.json())
  .then(geojson => {
    const worldCoords = [
      [90, -180], [90, 180], [-90, 180], [-90, -180], [90, -180]
    ];
    let holes = [];
    if (geojson.type === "Polygon") {
      holes.push(geojson.coordinates[0].map(c => [c[1], c[0]]));
    } else if (geojson.type === "MultiPolygon") {
      geojson.coordinates.forEach(poly => {
        holes.push(poly[0].map(c => [c[1], c[0]]));
      });
    }
    L.polygon([worldCoords, ...holes], {
      color: '#38bdf8',
      weight: 2,
      fillColor: '#ffffff',
      fillOpacity: 1,
      interactive: false
    }).addTo(map);
  })
  .catch(e => console.error("Failed to load map mask:", e));

// ── Governorates layer + hover stats ─────────────────────────────────────────
function getGovernorateName(feature) {
  const p = feature?.properties || {};
  const raw = p.gov_name_f || p.gouv_fr || p.nom_fr || p.name || p.NAME_1 || p.gouv_ar || 'Gouvernorat';
  const normalized = String(raw)
    .trim()
    .toLowerCase()
    .replace(/\s+/g, ' ')
    .split(' ')
    .map((w) => w.charAt(0).toUpperCase() + w.slice(1))
    .join(' ');

  // Correct frequent French spelling/casing variants from source data.
  const fixes = {
    'Le Kef': 'Le Kef',
    'Kef': 'Le Kef',
    'Sidi Bouzid': 'Sidi Bouzid',
    'Sidi Bou Zid': 'Sidi Bouzid',
    'Kairouan': 'Kairouan',
    'Ben Arous': 'Ben Arous',
    'Manubah': 'Manouba',
    'Beja': 'Beja',
    'Béja': 'Beja',
    'Kasserine': 'Kasserine',
    'Kassérine': 'Kasserine',
    'Medenine': 'Medenine',
    'Médenine': 'Medenine',
    'Gabes': 'Gabes',
    'Gabés': 'Gabes',
    'Medenine': 'Medenine',
  };
  return fixes[normalized] || normalized;
}

function pointInRing(lon, lat, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1];
    const xj = ring[j][0], yj = ring[j][1];
    const intersect = ((yi > lat) !== (yj > lat))
      && (lon < ((xj - xi) * (lat - yi)) / ((yj - yi) || Number.EPSILON) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

function pointInPolygonWithHoles(lon, lat, polygonCoords) {
  if (!polygonCoords || polygonCoords.length === 0) return false;
  if (!pointInRing(lon, lat, polygonCoords[0])) return false;
  for (let i = 1; i < polygonCoords.length; i++) {
    if (pointInRing(lon, lat, polygonCoords[i])) return false;
  }
  return true;
}

function pointInFeature(lon, lat, feature) {
  const geom = feature?.geometry;
  if (!geom) return false;
  if (geom.type === 'Polygon') {
    return pointInPolygonWithHoles(lon, lat, geom.coordinates);
  }
  if (geom.type === 'MultiPolygon') {
    return geom.coordinates.some(poly => pointInPolygonWithHoles(lon, lat, poly));
  }
  return false;
}

let currentReports = [];

function computeGovernorateStats(feature) {
  const rows = currentReports.filter(r => pointInFeature(r.longitude, r.latitude, feature));
  const byType = {};
  rows.forEach(r => {
    const key = r.domaine || 'AUTRE';
    byType[key] = (byType[key] || 0) + 1;
  });
  const sorted = Object.entries(byType).sort((a, b) => b[1] - a[1]);
  return { total: rows.length, byType: sorted };
}

function governorateTooltipHtml(name, stats) {
  const typesHtml = stats.byType.length
    ? stats.byType.map(([k, v]) => `<div>${k}: <b>${v}</b></div>`).join('')
    : '<div>Aucun signalement</div>';
  return `
    <div class="gov-card">
      <div class="gov-title">${name}</div>
      <div class="gov-total">Total signalements: <b>${stats.total}</b></div>
      <div class="gov-types">${typesHtml}</div>
    </div>
  `;
}

fetch('https://raw.githubusercontent.com/mtimet/tnacmaps/master/geojson/governorates.geojson')
  .then(res => res.json())
  .then(geojson => {
    governorateLayer = L.geoJSON(geojson, {
      style: () => ({
        color: '#60a5fa',
        weight: 1,
        fillColor: '#000000',
        fillOpacity: 0.01,
      }),
      onEachFeature: (feature, layer) => {
        layer.on('mouseover', (e) => {
          layer.setStyle({ weight: 2, color: '#93c5fd', fillOpacity: 0.08 });
          const name = getGovernorateName(feature);
          const stats = computeGovernorateStats(feature);
          layer.bindTooltip(governorateTooltipHtml(name, stats), {
            sticky: true,
            direction: 'top',
            className: 'gov-tooltip',
            opacity: 1,
          }).openTooltip(e.latlng);
        });
        layer.on('mouseout', () => {
          layer.setStyle({ weight: 1, color: '#60a5fa', fillOpacity: 0.01 });
          layer.closeTooltip();
        });
      },
    }).addTo(map);
  })
  .catch(err => console.warn('Governorates layer unavailable:', err));

// ── Marker cluster group ──────────────────────────────────────────────────────
let clusterGroup = L.markerClusterGroup({
  chunkedLoading: true,
  maxClusterRadius: 60,
  spiderfyOnMaxZoom: true,
  showCoverageOnHover: false,
});
map.addLayer(clusterGroup);

// ── Color logic ───────────────────────────────────────────────────────────────
function getMarkerColor(marker) {
  if (marker.statut === 'RESOLU') return '#22c55e';
  switch (marker.priorite) {
    case 'CRITIQUE': return '#ef4444';
    case 'HAUTE':    return '#f97316';
    case 'MOYENNE':  return '#eab308';
    case 'FAIBLE':   return '#22c55e';
    default:         return '#94a3b8';
  }
}

function createIcon(color) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 32" width="20" height="26">
    <!-- Ombre au sol -->
    <ellipse cx="12" cy="30" rx="3.5" ry="1.5" fill="#000000" opacity="0.4"/>
    <!-- Aiguille (grise) -->
    <path d="M10.5 15 L11.5 30 A0.5 0.5 0 0 0 12.5 30 L13.5 15 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="0.5"/>
    <!-- Tête de la punaise (ronde avec couleur) -->
    <circle cx="12" cy="10" r="9" fill="${color}" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Reflet 3D sur la tête -->
    <path d="M7 6 A 4.5 4.5 0 0 1 11 4" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round" fill="none" />
  </svg>`;
  return L.divIcon({
    html: svg,
    className: '',
    iconSize: [20, 26],
    iconAnchor: [10, 26],
    popupAnchor: [0, -26],
  });
}

// ── Badge helper ──────────────────────────────────────────────────────────────
const STATUT_LABELS = {

// ── Load markers ──────────────────────────────────────────────────────────────
let allMarkers = {};  // id → leaflet marker
let isMockMode = false;

function getMockReports(params = {}) {
  let filtered = [...MOCK_MARKERS];
  if (params.statut) filtered = filtered.filter(m => m.statut === params.statut);
  if (params.priorite) filtered = filtered.filter(m => m.priorite === params.priorite);
  if (params.domaine) filtered = filtered.filter(m => m.domaine === params.domaine);

  return {
    total: filtered.length,
    returned: filtered.length,
    offset: 0,
    data: filtered,
  };
}

function getMockReportDetail(id) {
  const marker = MOCK_MARKERS.find(m => m.id === id);
  if (!marker) throw new Error('Signalement introuvable');
  return {
    ...marker,
    description: `${marker.description_short} (detail mock)`,
    images: marker.has_images
      ? [{ id: 1, url: 'https://images.unsplash.com/photo-1515162816999-fc0af22db4ec?w=400&h=300&fit=crop' }]
      : [],
  };
}

async function loadMarkers(params = {}) {
  showLoading(true);
  const qs = new URLSearchParams({ limit: 1000, ...params }).toString();
  try {
    let json;
    if (FORCE_MOCK) {
      json = getMockReports(params);
      isMockMode = true;
      currentReports = json.data;
    } else {
      const res = await fetch(`${API_BASE}/map/reports?${qs}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      json = await res.json();
      isMockMode = false;
      currentReports = json.data;
    }

    clusterGroup.clearLayers();
    allMarkers = {};

    json.data.forEach(r => {
      const color = getMarkerColor(r);
      const icon = createIcon(color);
      const m = L.marker([r.latitude, r.longitude], { icon })
        .bindTooltip(`
          <b>#${r.id}</b> — ${r.domaine || 'N/A'}<br>
          ${r.description_short}<br>
          <small>${badge(PRIORITE_LABELS[r.priorite]?.[0] || '#94a3b8', r.priorite || '—')} ${r.vote_count} votes</small>
        `, { direction: 'top', offset: [0, -36] });

      m.on('click', () => openDetail(r.id));
      clusterGroup.addLayer(m);
      allMarkers[r.id] = m;
    });

    // Update counters
    document.getElementById('marker-count').textContent = FORCE_MOCK
      ? `⚠ Mode mock actif (${json.returned} signalements)`
      : `${json.returned} / ${json.total} signalements`;
    updateStats(json.data);

  } catch (e) {
    console.error('Load error:', e);
    isMockMode = false;
    currentReports = [];
    clusterGroup.clearLayers();
    allMarkers = {};
    updateStats([]);
    document.getElementById('marker-count').textContent = '❌ Erreur de connexion à l\'API';
  } finally {
    showLoading(false);
  }
}

function updateStats(data) {
  document.getElementById('stat-total').textContent = data.length;
  document.getElementById('stat-critique').textContent = data.filter(r => r.priorite === 'CRITIQUE').length;
  document.getElementById('stat-resolus').textContent = data.filter(r => r.statut === 'RESOLU').length;
}

// ── Detail panel ──────────────────────────────────────────────────────────────
async function openDetail(id) {
  document.getElementById('detail-title').textContent = `Signalement #${id}`;
  document.getElementById('detail-content').innerHTML = '<p style="color:#64748b;font-size:13px">Chargement...</p>';
  document.getElementById('detail-panel').classList.add('active');

  try {
    let r;
    if (isMockMode) {
      r = getMockReportDetail(id);
    } else {
      const res = await fetch(`${API_BASE}/map/reports/${id}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      r = await res.json();
    }

    const [sc, sl] = STATUT_LABELS[r.statut] || ['#64748b', r.statut];
    const [pc, pl] = PRIORITE_LABELS[r.priorite] || ['#94a3b8', r.priorite || '—'];

    let imagesHtml = '';
    if (r.images && r.images.length > 0) {
      imagesHtml = `<div class="detail-field">
        <div class="key">Images (${r.images.length})</div>
        <div class="detail-images">
          ${r.images.map(img => img.url
            ? `<img src="${img.url}" onerror="this.style.display='none'" />`
            : `<div style="width:80px;height:60px;background:#1e293b;border-radius:6px;border:1px solid #334155;display:flex;align-items:center;justify-content:center;font-size:20px">📷</div>`
          ).join('')}
        </div>
      </div>`;
    }

    document.getElementById('detail-content').innerHTML = `
      <div class="detail-field">
        <div class="key">Description</div>
        <div class="val">${r.description}</div>
      </div>
      <div class="detail-field">
        <div class="key">Statut</div>
        <div class="val">${badge(sc, sl)}</div>
      </div>
      <div class="detail-field">
        <div class="key">Priorité</div>
        <div class="val">${badge(pc, pl)}</div>
      </div>
      <div class="detail-field">
        <div class="key">Gravité</div>
        <div class="val">${r.gravite || '—'}</div>
      </div>
      <div class="detail-field">
        <div class="key">Domaine</div>
        <div class="val">${r.domaine || '—'}</div>
      </div>
      <div class="detail-field">
        <div class="key">Score IA</div>
        <div class="val">${r.score_ai !== null ? `${r.score_ai.toFixed(1)} / 100` : '—'}</div>
      </div>
      <div class="detail-field">
        <div class="key">Votes citoyens</div>
        <div class="val">👍 ${r.vote_count}</div>
      </div>
      <div class="detail-field">
        <div class="key">Date de création</div>
        <div class="val">${formatDate(r.date_creation)}</div>
      </div>
      <div class="detail-field">
        <div class="key">Localisation</div>
        <div class="val">${r.latitude?.toFixed(5)}, ${r.longitude?.toFixed(5)}</div>
      </div>
      ${imagesHtml}
    `;

    // Pan to marker
    if (allMarkers[id]) {
      map.setView([r.latitude, r.longitude], 15);
    }
  } catch (e) {
    document.getElementById('detail-content').innerHTML = `<p style="color:#ef4444">Erreur: ${e.message}</p>`;
  }
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('active');
}

// ── Filters ───────────────────────────────────────────────────────────────────
function applyFilters() {
  const params = {};
  const statut   = document.getElementById('f-statut').value;
  const priorite = document.getElementById('f-priorite').value;
  const domaine  = document.getElementById('f-domaine').value;
  if (statut)   params.statut   = statut;
  if (priorite) params.priorite = priorite;
  if (domaine)  params.domaine  = domaine;
  loadMarkers(params);
}

function resetFilters() {
  document.getElementById('f-statut').value   = '';
  document.getElementById('f-priorite').value = '';
  document.getElementById('f-domaine').value  = '';
  loadMarkers();
}

// ── Loading ───────────────────────────────────────────────────────────────────
function showLoading(show) {
  document.getElementById('loading').style.display = show ? 'block' : 'none';
}

// ── WebSocket ─────────────────────────────────────────────────────────────────
let ws, wsRetries = 0;

function connectWS() {
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    wsRetries = 0;
    document.getElementById('ws-dot').className = 'connected';
    document.getElementById('ws-label').textContent = 'Connecté';
  };

  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    if (msg.event === 'new_signalement') {
      const r = msg.data;
      const color = getMarkerColor(r);
      const m = L.marker([r.latitude, r.longitude], { icon: createIcon(color) })
        .bindTooltip(`<b>🆕 Nouveau #${r.id}</b><br>${r.description_short}`, { direction: 'top', offset: [0, -36] });
      m.on('click', () => openDetail(r.id));
      clusterGroup.addLayer(m);
      allMarkers[r.id] = m;

      // Flash notification
      showNotification(`🆕 Nouveau signalement #${r.id} — ${r.domaine || 'N/A'}`);
    }
  };

  ws.onclose = () => {
    document.getElementById('ws-dot').className = '';
    document.getElementById('ws-label').textContent = 'Déconnecté';
    // Reconnect with backoff
    if (wsRetries < 5) {
      setTimeout(() => { wsRetries++; connectWS(); }, 3000 * (wsRetries + 1));
    }
  };

  ws.onerror = () => {
    document.getElementById('ws-label').textContent = 'Erreur WS';
  };

  // Heartbeat ping
  setInterval(() => {
    if (ws.readyState === WebSocket.OPEN) ws.send('ping');
  }, 25000);
}

// ── Toast notification ────────────────────────────────────────────────────────
function showNotification(text) {
  const el = document.createElement('div');
  el.style.cssText = `
    position:fixed;bottom:20px;right:20px;background:#1e293b;border:1px solid #334155;
    color:#e2e8f0;padding:12px 16px;border-radius:8px;font-size:13px;z-index:9999;
    animation:fadeIn 0.3s ease;max-width:300px;border-left:3px solid #38bdf8;
  `;
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

// ── Init ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  API_BASE = await detectApiBase();
  WS_URL = buildWsUrl(API_BASE);
  loadMarkers();
  connectWS();
});
</script>
